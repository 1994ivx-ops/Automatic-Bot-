[build]
builder = "nixpacks"
# nixpacks.toml in this directory drives all build details.
# Railway must have "Root Directory" set to "telegram-bot/" in the service
# settings for relative paths (requirements.txt, main.py) to resolve correctly.

[deploy]
startCommand = "python main.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
