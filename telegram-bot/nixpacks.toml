# nixpacks.toml — Railway build configuration for Playwright + Telethon

# ── Force Python 3.11 ─────────────────────────────────────────────────────────
# NIXPACKS_PYTHON_VERSION is the canonical override recognised by the nixpacks
# python provider. Setting it here (not in railway.toml [build.env]) is the
# only approach that survives Nixpacks plan caching on Railway.
[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

# ── Declare python as the sole provider ───────────────────────────────────────
# Prevents nixpacks from guessing a mixed provider set (e.g. node+python).
providers = ["python"]

# ── System packages required by Playwright's Chromium headless shell ──────────
[phases.setup]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libdbus-1-3",
  "libx11-6",
  "libxext6",
  "libxcb1",
  "libpango-1.0-0",
  "libcairo2",
  "libfontconfig1"
]

# ── Install phase ─────────────────────────────────────────────────────────────
# pip install first, then download the Chromium binary into the build image.
# playwright install MUST happen at build time — the binary is not shipped with
# the pip wheel and cannot be downloaded at runtime on Railway.
[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium"
]

# ── Start command (fallback — railway.toml startCommand takes precedence) ─────
[start]
cmd = "python main.py"
