# nixpacks.toml — Railway build configuration for Playwright + Telethon
# Nixpacks reads this file to wire apt packages and custom build steps.

[phases.setup]
aptPkgs = [
  # Core Chromium headless shell dependencies (verified against ldd output)
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  # Additional libs discovered missing during local ldd checks
  "libdbus-1-3",
  "libx11-6",
  "libxext6",
  "libxcb1",
  # Font rendering
  "libpango-1.0-0",
  "libcairo2",
  "libfontconfig1"
]

[phases.install]
cmds = [
  # Install Python packages first
  "pip install -r requirements.txt",
  # Download Chromium browser binary into the build image
  "playwright install chromium"
]

[start]
cmd = "python main.py"
